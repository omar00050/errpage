<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Service temporarily unavailable | 502</title>
<style>
  :root {
    --bg: #E9EEF5;
    --surface: #FFFFFF;
    --ink: #1E2B3C;
    --muted: #5B6B80;
    --line: #C9D3E0;
    --accent: #3461D9;
    --accent-ink: #FFFFFF;
    --spark: #F2A516;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131A25;
      --surface: #1C2533;
      --ink: #E6ECF4;
      --muted: #93A2B6;
      --line: #344257;
      --accent: #6C8FF5;
      --accent-ink: #0E1520;
      --spark: #FFC14D;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    line-height: 1.7;
  }
  main {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  .logo { display: block; margin: 0 auto 28px; max-width: 220px; width: 60%; height: auto; }
  .cable { width: 100%; max-width: 360px; height: auto; margin: 0 auto 8px; display: block; }
  .cable .wire { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
  .cable .body { fill: var(--ink); }
  .cable .pin { fill: var(--muted); }
  .cable .spark { fill: none; stroke: var(--spark); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .plug-l { animation: drift-l 3.2s ease-in-out infinite; }
  .plug-r { animation: drift-r 3.2s ease-in-out infinite; }
  .spark  { animation: spark 3.2s ease-in-out infinite; }
  @keyframes drift-l { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  @keyframes drift-r { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
  @keyframes spark   { 0%,40%,60%,100% { opacity: 0; } 48%,52% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .plug-l, .plug-r, .spark { animation: none; }
  }
  .code {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  h1 {
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.35;
    margin: 6px 0 12px;
  }
  p { color: var(--muted); font-size: 17px; }
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 999px;
    padding: 12px 32px;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--spark); outline-offset: 3px; }
  .countdown { font-size: 14px; color: var(--muted); min-height: 1.7em; }
</style>
</head>
<body>
<main>
  <img class="logo" src="https://clearsourcetranslation.com/wp-content/uploads/2017/03/cst-1231.png" alt="ClearSource Translation" onerror="this.style.display='none'">

  <svg class="cable" viewBox="0 0 360 120" role="img" aria-label="An unplugged cable">
    <g class="plug-r">
      <path class="wire" d="M8 60 H110"/>
      <rect class="body" x="110" y="38" width="44" height="44" rx="8"/>
      <rect class="pin" x="154" y="48" width="18" height="6" rx="2"/>
      <rect class="pin" x="154" y="66" width="18" height="6" rx="2"/>
    </g>
    <g class="spark">
      <path d="M180 40 l-6 12 h10 l-6 12"/>
      <path d="M168 34 l-6 -8"/>
      <path d="M192 34 l6 -8"/>
      <path d="M168 86 l-6 8"/>
      <path d="M192 86 l6 8"/>
    </g>
    <g class="plug-l">
      <rect class="body" x="206" y="38" width="44" height="44" rx="8"/>
      <rect class="pin" x="214" y="50" width="8" height="20" rx="2" opacity=".35"/>
      <rect class="pin" x="234" y="50" width="8" height="20" rx="2" opacity=".35"/>
      <path class="wire" d="M250 60 H352"/>
    </g>
  </svg>

  <div class="code">Error 502</div>
  <h1>Our server isn’t responding right now</h1>
  <p>Your request reached us, but the service behind it didn’t answer. We’re likely updating something or handling a short spike in traffic. This page will try again on its own.</p>

  <div class="actions">
    <button type="button" id="retry">Try again</button>
    <div class="countdown" id="countdown" aria-live="polite"></div>
  </div>

</main>

<script>
  (function () {
    var seconds = 30;
    var el = document.getElementById('countdown');
    var btn = document.getElementById('retry');
    function render() {
      el.textContent = 'Retrying automatically in ' + seconds + 's';
    }
    btn.addEventListener('click', function () { location.reload(); });
    render();
    var t = setInterval(function () {
      seconds -= 1;
      if (seconds <= 0) {
        clearInterval(t);
        el.textContent = 'Retrying now…';
        location.reload();
      } else {
        render();
      }
    }, 1000);
  })();
</script>
</body>
</html>
